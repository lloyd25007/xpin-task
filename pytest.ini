[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# --strict-markers turns a typo'd marker into an error rather than a silently
# unselected test. Every marker below must therefore be declared.
addopts =
    --strict-markers
    --tb=short
    -ra

markers =
    unit: pure logic; no network, database or LLM. Always runnable.
    integration: needs a populated FAISS index and/or a reachable Neo4j.
    evaluation: RAG quality metrics; needs live stores and calls the LLM.
    slow: takes more than a few seconds.

# The evaluation layer is opt-in: it costs LLM quota and its scores legitimately
# vary between runs, so a bare `pytest` must not trigger it. Select it with
# `pytest tests/evaluation -m evaluation`.
# Third-party deprecation noise drowns the actual test output.
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:huggingface_hub.*
    ignore::UserWarning:torch.*

log_cli = false
log_cli_level = WARNING
